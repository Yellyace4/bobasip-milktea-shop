<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark">
  <title>BobaSip</title>
  <link rel="icon" type="image/png" href="/images/bobasip-logo.png" />
  <script>(function(){try{var d=localStorage.getItem('bobasip_theme')==='dark';if(d){document.documentElement.classList.add('dark');document.documentElement.style.backgroundColor='#1E1915';}else{document.documentElement.style.backgroundColor='#faf5ec';}}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=57" />
</head>
<body data-page="welcome" class="user-shell-page bg-cream text-ink font-sans min-h-screen antialiased">
  <div class="fixed inset-0 -z-10 bg-decor" aria-hidden="true"></div>
  <div class="fixed inset-0 -z-10 grain" aria-hidden="true"></div>
  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-xl text-center">
      <img src="images/bobasip-logo.png" alt="BobaSip Logo" class="w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-6 object-contain logo-adaptive" />
      <p class="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-wide text-accent mb-4">WELCOME</p>
      <h1 class="font-display text-4xl sm:text-5xl font-extrabold leading-tight">A slower sip for everyday moments.</h1>
      <p class="mt-1 mb-20 text-ink-soft font-semibold text-base sm:text-lg max-w-lg mx-auto">Natural milktea, warm wood, soft light, and a quiet place to pause.</p>
      <a href="login.html" class="inline-flex items-center justify-center gap-2 px-12 py-4 rounded-xl bg-gradient-to-br from-accent to-brown text-white font-extrabold shadow-soft hover:brightness-105 transition">Get started!</a>
    </div>
  </main>
  <div class="toast fixed bottom-24 left-1/2 -translate-x-1/2 translate-y-5 bg-brown-dark text-white px-5 py-3 rounded-full font-bold text-sm opacity-0 transition-all duration-300 z-[60] pointer-events-none shadow-soft"></div>
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js?v=153"></script>
</body>
</html>
